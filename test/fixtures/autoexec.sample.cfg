// autoexec.cfg 样例（脱敏整理）：GBK 编码版本
// Sample autoexec.cfg (sanitized). 本文件为 GBK 编码，用于覆盖中文注释的编码链路；
// 与 autoexec_utf8.sample.cfg 内容完全一致，仅编码不同。

// 帧率与材质 / Frame rate & materials
fps_max 240
fps_max_usec 0
mat_queue_mode 2
threads 4
cl_showfps 0
showfps_enabled 0
shownet_enabled 0

// 鼠标 / Mouse
m_rawinput 1
m_filter 0
mouse_sensitivity 1.8

/*
 * 网络参数：多数由服务器控制，改动前先理解含义
 * Network settings: most are server-controlled. Understand them before editing.
 */
rate 1280000
cl_updaterate 128
cl_updaterate_mp 128
cl_interp 0
cl_interp_ratio 1
projectile_prediction 1
cl_smooth 1

// 音画 / Audio & video
snd_mixahead 0.05
snd_setmixer GlobalFootsteps vol 1.2
miles_occlusion 0
mat_vsync 0
mat_antialias 4
mat_forceaniso 8
mat_picmip 1
stream_memory 300000
ssao_enabled 0
mat_postprocess_enable 1
r_shadows 1
r_waterdrawreflection 1

// 视野 / View
cl_fovscale 1.55

// 键位绑定（值含引号）/ Binds (quoted values)
bind "F3" "exec autoexec.cfg"
bind "F6" "mat_setvideomode 1728 1080 0" // 一键切回拉伸分辨率

// 重复键：引擎执行时后写覆盖先写，编辑器两行都保留
// Duplicate key: the engine keeps the last one; the editor preserves both lines.
cl_showfps 4
