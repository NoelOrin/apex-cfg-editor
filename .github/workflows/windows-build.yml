name: windows-build
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build windows --release

      - name: Zip release bundle
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $zip = "apex-cfg-editor-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: apex-cfg-editor-windows
          path: build/windows/x64/runner/Release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: apex-cfg-editor-windows-*.zip
