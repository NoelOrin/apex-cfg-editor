name: windows-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.2.0 或 v1.2.0"
        required: true
        type: string
      release_name:
        description: "Release 标题；留空则使用 Apex CFG Editor v<version>"
        required: false
        type: string
      prerelease:
        description: "标记为预发布版本"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_RELEASE_NAME: ${{ inputs.release_name }}
      INPUT_PRERELEASE: ${{ inputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $rawVersion = $env:INPUT_VERSION
            $rawReleaseName = $env:INPUT_RELEASE_NAME
            $prerelease = $env:INPUT_PRERELEASE
          } else {
            $rawVersion = $env:GITHUB_REF_NAME
            $rawReleaseName = ""
            $prerelease = "false"
          }

          $rawVersion = ($rawVersion ?? "").Trim()
          if ($rawVersion.StartsWith("v")) {
            $tag = $rawVersion
          } else {
            $tag = "v$rawVersion"
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "版本号必须符合 vMAJOR.MINOR.PATCH，例如 v1.2.0；收到：$tag"
          }

          $appVersion = $tag.Substring(1)
          $releaseName = ($rawReleaseName ?? "").Trim()
          if ([string]::IsNullOrWhiteSpace($releaseName)) {
            $releaseName = "Apex CFG Editor $tag"
          }
          $releaseName = $releaseName -replace '[\r\n]+', ' '

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: >-
          flutter build windows --release
          --build-name ${{ steps.release.outputs.app_version }}
          --build-number ${{ github.run_number }}
          --dart-define=APP_VERSION=${{ steps.release.outputs.app_version }}
          --dart-define=APP_BUILD_NUMBER=${{ github.run_number }}

      - name: Compile installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC not at default path, installing via Chocolatey"
            choco install innosetup -y --no-progress
            if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          }

          if (Test-Path packaging/Release) {
            Remove-Item packaging/Release -Recurse -Force
          }
          New-Item packaging/Release -ItemType Directory -Force | Out-Null
          Copy-Item "build/windows/x64/runner/Release/*" "packaging/Release" -Recurse -Force

          if (Test-Path installer) {
            Remove-Item installer -Recurse -Force
          }
          & $iscc packaging/apex_cfg_editor.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup 编译失败，退出码：$LASTEXITCODE"
          }
          Get-ChildItem installer

      - name: Create portable ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $zip = "apex-cfg-editor-windows-$env:RELEASE_TAG.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip -Force
          Get-Item $zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: apex-cfg-editor-windows-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          path: |
            build/windows/x64/runner/Release/
            installer/ApexCfgEditorSetup-*.exe
            apex-cfg-editor-windows-*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.release_name }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            apex-cfg-editor-windows-*.zip
            installer/ApexCfgEditorSetup-*.exe
